<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema Cloud Compras</title>
    <style>
        :root { --p: #2c3e50; --s: #27ae60; --f: #8e44ad; }
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; }
        nav { background: var(--p); padding: 10px; display: flex; gap: 10px; overflow-x: auto; }
        nav a { color: white; cursor: pointer; padding: 10px; text-decoration: none; font-size: 13px; border-radius: 4px; white-space: nowrap; }
        nav a:hover { background: rgba(255,255,255,0.2); }
        .container { max-width: 1100px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; }
        .page { display: none; } .active { display: block; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: var(--s); color: white; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
    </style>
</head>
<body>

<nav>
    <a onclick="show('p-forn')">Fornecedores</a>
    <a onclick="show('p-prod')">Produtos</a>
    <a onclick="show('p-comp')">Lista de Compras</a>
    <a onclick="show('p-conf')">Config (Unidades/Grupos)</a>
    <a onclick="show('p-login')" style="background: var(--f)">Portal Fornecedor</a>
</nav>

<div class="container">
    <section id="p-conf" class="page">
        <h2>Configurações de Apoio</h2>
        <div class="form-grid">
            <input type="text" id="conf_unidade" placeholder="Nova Unidade (Ex: KG)">
            <button onclick="enviarSimples('Unidades', 'conf_unidade')">Cadastrar Unidade</button>
            <input type="text" id="conf_grupo" placeholder="Novo Grupo (Ex: Alimentos)">
            <button onclick="enviarSimples('Grupos', 'conf_grupo')">Cadastrar Grupo</button>
        </div>
    </section>

    <section id="p-forn" class="page">
        <h2>Cadastro de Fornecedor</h2>
        <div class="form-grid">
            <input type="text" id="f_nome" placeholder="Razão Social">
            <input type="text" id="f_vendedor" placeholder="Vendedor">
            <input type="email" id="f_email" placeholder="E-mail">
            <input type="text" id="f_tel" placeholder="Telefone">
            <button onclick="salvarForn()">Salvar no Google</button>
        </div>
    </section>

    <section id="p-prod" class="page">
        <h2>Cadastro de Produto</h2>
        <div class="form-grid">
            <input type="text" id="p_nome" placeholder="Produto">
            <input type="text" id="p_marca" placeholder="Marca">
            <input type="text" id="p_un" placeholder="Unidade">
            <input type="number" id="p_fator" placeholder="Fator">
            <button onclick="salvarProd()">Salvar no Google</button>
        </div>
    </section>

    <section id="p-comp" class="page">
        <h2>Gerar Lista de Cotação</h2>
        <div class="form-grid">
            <input type="date" id="l_data">
            <input type="text" id="l_item" placeholder="Item">
            <input type="number" id="l_qtd" placeholder="Qtd">
            <button onclick="addLista()">Add na Lista</button>
        </div>
        <table id="tab-lista"><thead><tr><th>Produto</th><th>Qtd</th></tr></thead><tbody></tbody></table>
        <button onclick="alert('Lista salva localmente para cotação!')" style="width:100%; margin-top:10px; background:var(--p)">Finalizar Lista</button>
    </section>

    <section id="p-login" class="page">
        <div style="max-width:300px; margin:auto; text-align:center">
            <h2>Login Fornecedor</h2>
            <input type="email" id="log_e" placeholder="E-mail" style="width:100%"><br><br>
            <input type="password" id="log_s" placeholder="Telefone" style="width:100%"><br><br>
            <button onclick="login()" style="width:100%">Entrar</button>
        </div>
    </section>

    <section id="p-portal" class="page">
        <h2>Preencher Cotação</h2>
        <table id="tab-cotar">
            <thead><tr><th>Produto</th><th>Qtd</th><th>Preço</th><th>Obs</th></tr></thead>
            <tbody></tbody>
        </table>
        <button onclick="enviarCotacaoFinal()" style="width:100%; margin-top:20px; background:var(--f)">ENVIAR PREÇOS PARA PLANILHA</button>
    </section>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzbkS4Vv9SoN90HvjuQsjX0X-OW5CBDcSsNblBVPriZncx3U-V79T48H5W9gd2mM-TEZA/exec"; // <--- COLE SUA URL AQUI
    let listaLocal = [];
    let userLogado = "";

    function show(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function apiPost(dados) {
        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(dados)
            });
            alert("Sincronizado com Google Sheets!");
        } catch(e) { alert("Erro ao salvar"); }
    }

    function enviarSimples(aba, inputId) {
        const val = document.getElementById(inputId).value;
        apiPost({aba: aba, valor: val});
        document.getElementById(inputId).value = '';
    }

    function salvarForn() {
        apiPost({
            aba: "Fornecedores",
            nome: document.getElementById('f_nome').value,
            vendedor: document.getElementById('f_vendedor').value,
            email: document.getElementById('f_email').value,
            tel: document.getElementById('f_tel').value
        });
    }

    function salvarProd() {
        apiPost({
            aba: "Produtos",
            nome: document.getElementById('p_nome').value,
            marca: document.getElementById('p_marca').value,
            unidade: document.getElementById('p_un').value,
            fator: document.getElementById('p_fator').value
        });
    }

    function addLista() {
        const item = { prod: document.getElementById('l_item').value, qtd: document.getElementById('l_qtd').value };
        listaLocal.push(item);
        renderLista();
    }

    function renderLista() {
        document.querySelector('#tab-lista tbody').innerHTML = listaLocal.map(i => `<tr><td>${i.prod}</td><td>${i.qtd}</td></tr>`).join('');
    }

    function login() {
        // Na vida real, aqui você faria um fetch para validar o e-mail na planilha. 
        // Para este exemplo, ele aceita qualquer login para liberar o portal.
        userLogado = document.getElementById('log_e').value;
        show('p-portal');
        document.querySelector('#tab-cotar tbody').innerHTML = listaLocal.map((i, idx) => `
            <tr>
                <td>${i.prod}</td>
                <td>${i.qtd}</td>
                <td><input type="number" class="p-input" data-idx="${idx}" step="0.01"></td>
                <td><input type="text" class="o-input" data-idx="${idx}"></td>
            </tr>
        `).join('');
    }

    function enviarCotacaoFinal() {
        const precos = document.querySelectorAll('.p-input');
        const obss = document.querySelectorAll('.o-input');
        const itensEnvio = listaLocal.map((item, i) => ({
            produto: item.prod,
            qtd: item.qtd,
            preco: precos[i].value,
            observacao: obss[i].value
        }));

        apiPost({
            aba: "CotacoesEnviadas",
            fornecedor: userLogado,
            itens: itensEnvio
        });
        alert("Sua cotação foi enviada para nossa planilha central!");
        location.reload();
    }
</script>
</body>
</html>
